<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b1712">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Euskal Liga">
<title>Euskal Liga Manager</title>
<style>
  :root{
    --bg:#0b1712; --surface:#122019; --surface-2:#18291f; --surface-3:#1f3327;
    --line:#284437; --line-soft:#1d3227;
    --ink:#eef3ea; --muted:#9db0a4; --faint:#6f8578;
    --accent:#d81e34; --accent-ink:#ff6072;
    --grass:#2ea36b; --grass-ink:#4fd196;
    --gold:#e8b73a; --gold-ink:#f2cf6f;
    --good:#4fd196; --warn:#e8b73a; --bad:#e86b6b;
    --shadow:0 10px 30px rgba(0,0,0,.45);
    --font-disp:"Arial Narrow","Roboto Condensed","Oswald","Helvetica Neue",sans-serif;
    --font-body:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
    --font-mono:"SF Mono",ui-monospace,"Consolas",monospace;
  }
  @media (prefers-color-scheme: light){
    :root{
      --bg:#eceadd; --surface:#faf8ef; --surface-2:#f2efe1; --surface-3:#e7e3d1;
      --line:#d6d0bd; --line-soft:#e2ddca;
      --ink:#16241c; --muted:#5a6a5e; --faint:#8a978c;
      --accent:#c8102e; --accent-ink:#a10c24;
      --grass:#1f7a4d; --grass-ink:#155a38;
      --gold:#b8862a; --gold-ink:#8f6819;
      --good:#1f7a4d; --warn:#a6781a; --bad:#c0392b;
      --shadow:0 8px 24px rgba(40,50,40,.14);
    }
  }
  :root[data-theme="light"]{
    --bg:#eceadd; --surface:#faf8ef; --surface-2:#f2efe1; --surface-3:#e7e3d1;
    --line:#d6d0bd; --line-soft:#e2ddca;
    --ink:#16241c; --muted:#5a6a5e; --faint:#8a978c;
    --accent:#c8102e; --accent-ink:#a10c24;
    --grass:#1f7a4d; --grass-ink:#155a38;
    --gold:#b8862a; --gold-ink:#8f6819;
    --good:#1f7a4d; --warn:#a6781a; --bad:#c0392b;
    --shadow:0 8px 24px rgba(40,50,40,.14);
  }
  :root[data-theme="dark"]{
    --bg:#0b1712; --surface:#122019; --surface-2:#18291f; --surface-3:#1f3327;
    --line:#284437; --line-soft:#1d3227;
    --ink:#eef3ea; --muted:#9db0a4; --faint:#6f8578;
    --accent:#d81e34; --accent-ink:#ff6072;
    --grass:#2ea36b; --grass-ink:#4fd196;
    --gold:#e8b73a; --gold-ink:#f2cf6f;
    --good:#4fd196; --warn:#e8b73a; --bad:#e86b6b;
    --shadow:0 10px 30px rgba(0,0,0,.45);
  }

  *{box-sizing:border-box}
  body{margin:0}
  .app{
    min-height:100vh;background:var(--bg);color:var(--ink);
    font-family:var(--font-body);line-height:1.5;
    background-image:repeating-linear-gradient(90deg,transparent 0 64px,rgba(46,163,107,.035) 64px 128px);
  }
  .wrap{max-width:1040px;margin:0 auto;padding:0 20px 80px}

  .topbar{position:sticky;top:0;z-index:20;background:var(--bg);border-bottom:2px solid var(--line)}
  .topbar-in{max-width:1040px;margin:0 auto;padding:14px 20px;display:flex;align-items:center;gap:16px;flex-wrap:wrap}
  .brand{display:flex;align-items:center;gap:12px;margin-right:auto}
  .brand h1{font-family:var(--font-disp);font-weight:800;font-stretch:condensed;text-transform:uppercase;letter-spacing:.06em;margin:0;font-size:26px;line-height:1}
  .brand .kick{font-size:11px;letter-spacing:.22em;text-transform:uppercase;color:var(--faint);font-weight:700}
  .brand .ik{display:flex;flex-direction:column;height:30px;width:30px;border-radius:6px;overflow:hidden;box-shadow:var(--shadow)}
  .brand .ik span{flex:1}
  .brand .ik .r{background:var(--accent)}
  .brand .ik .g{background:var(--grass)}
  .brand .ik .w{background:#f4f4ee}

  .hud{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
  .hud .chip{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:6px 12px;display:flex;flex-direction:column;line-height:1.15;min-width:60px}
  .hud .chip .lab{font-size:9px;letter-spacing:.14em;text-transform:uppercase;color:var(--faint);font-weight:700}
  .hud .chip .val{font-family:var(--font-disp);font-weight:800;font-size:18px;font-stretch:condensed}
  .iconbtn{background:var(--surface);border:1px solid var(--line);color:var(--ink);border-radius:10px;width:38px;height:38px;font-size:16px;cursor:pointer}
  .iconbtn:hover{border-color:var(--grass)}

  .btn{font-family:var(--font-disp);font-weight:800;font-stretch:condensed;text-transform:uppercase;letter-spacing:.05em;cursor:pointer;border-radius:11px;border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:11px 18px;font-size:16px;transition:transform .06s,border-color .12s}
  .btn:hover{border-color:var(--grass)}
  .btn:active{transform:scale(.98)}
  .btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
  .btn.primary:hover{filter:brightness(1.08)}
  .btn.primary:disabled{opacity:.45;cursor:not-allowed;filter:none}
  .btn.ghostgold{border-color:var(--gold);color:var(--gold-ink)}
  .btn.sm{padding:6px 12px;font-size:13px}

  .nav{display:flex;gap:4px;margin:22px 0 20px;border-bottom:1px solid var(--line);flex-wrap:nowrap;overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:thin}
  .nav::-webkit-scrollbar{height:4px}
  .nav button{background:none;border:none;color:var(--muted);cursor:pointer;padding:10px 14px 12px;font-family:var(--font-disp);font-weight:700;font-stretch:condensed;text-transform:uppercase;letter-spacing:.05em;font-size:16px;border-bottom:3px solid transparent;margin-bottom:-1px;white-space:nowrap;flex:0 0 auto}
  .nav button:hover{color:var(--ink)}
  .nav button.active{color:var(--ink);border-bottom-color:var(--accent)}

  .crest{border-radius:50%;display:flex;align-items:center;justify-content:center;flex:none;font-family:var(--font-disp);font-weight:800;color:#fff;box-shadow:var(--shadow);position:relative;overflow:hidden}
  .crest .txt{position:relative;z-index:2;text-shadow:0 1px 2px rgba(0,0,0,.5)}
  .card{background:var(--surface);border:1px solid var(--line);border-radius:14px}

  table{width:100%;border-collapse:collapse;font-size:14px}
  th{font-family:var(--font-disp);font-weight:700;font-stretch:condensed;text-transform:uppercase;letter-spacing:.06em;color:var(--faint);text-align:left;padding:10px 10px;font-size:12px;border-bottom:1px solid var(--line)}
  td{padding:9px 10px;border-bottom:1px solid var(--line-soft)}
  tr:last-child td{border-bottom:none}
  .num{font-family:var(--font-mono);font-variant-numeric:tabular-nums;text-align:center}
  .tbl-scroll{overflow-x:auto}

  .teamcell{display:flex;align-items:center;gap:10px}
  .teamcell .nm{font-weight:600}
  .pos{width:26px;text-align:center;font-family:var(--font-disp);font-weight:800;font-size:15px}
  .zone-champ{box-shadow:inset 3px 0 0 var(--gold)}
  .zone-desc{box-shadow:inset 3px 0 0 var(--bad)}
  .is-you{background:color-mix(in srgb,var(--grass) 12%,transparent)}
  .is-you .nm{color:var(--grass-ink)}

  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
  @media(max-width:720px){.grid2{grid-template-columns:1fr}}

  .sect-title{font-family:var(--font-disp);font-weight:800;font-stretch:condensed;text-transform:uppercase;letter-spacing:.05em;font-size:20px;margin:0 0 4px}
  .sub{color:var(--muted);font-size:13px;margin:0 0 14px}
  .muted{color:var(--muted)}

  .pill{display:inline-block;font-family:var(--font-disp);font-weight:800;font-size:11px;padding:2px 8px;border-radius:20px;letter-spacing:.03em}
  .p-GK{background:color-mix(in srgb,var(--gold) 22%,transparent);color:var(--gold-ink)}
  .p-DF{background:color-mix(in srgb,var(--grass) 20%,transparent);color:var(--grass-ink)}
  .p-MF{background:color-mix(in srgb,#5b8def 22%,transparent);color:#8fb4ff}
  .p-FW{background:color-mix(in srgb,var(--accent) 22%,transparent);color:var(--accent-ink)}
  :root[data-theme="light"] .p-MF{color:#2c5fb8}
  @media(prefers-color-scheme:light){:root:not([data-theme="dark"]) .p-MF{color:#2c5fb8}}

  .rating{font-family:var(--font-disp);font-weight:800;font-size:16px;text-align:center;width:34px;height:28px;line-height:28px;border-radius:7px;display:inline-block}
  .potstars{color:var(--gold-ink);letter-spacing:1px;font-size:12px;white-space:nowrap}
  .potstars .off{color:var(--faint);opacity:.5}
  .badge-prom{display:inline-block;font-family:var(--font-disp);font-weight:800;font-size:9px;letter-spacing:.08em;background:color-mix(in srgb,var(--gold) 26%,transparent);color:var(--gold-ink);padding:1px 6px;border-radius:6px;vertical-align:middle}
  .badge-crack{display:inline-block;font-family:var(--font-disp);font-weight:800;font-size:9px;letter-spacing:.08em;background:color-mix(in srgb,#a06bff 32%,transparent);color:#c9a8ff;padding:1px 6px;border-radius:6px;vertical-align:middle}
  .badge-cap{display:inline-block;font-family:var(--font-disp);font-weight:800;font-size:9px;letter-spacing:.08em;background:color-mix(in srgb,var(--gold) 34%,transparent);color:var(--gold-ink);padding:1px 6px;border-radius:6px;vertical-align:middle}
  .badge-taker{display:inline-block;font-family:var(--font-disp);font-weight:800;font-size:9px;letter-spacing:.08em;background:color-mix(in srgb,var(--accent) 30%,transparent);color:var(--accent);padding:1px 6px;border-radius:6px;vertical-align:middle}
  :root[data-theme="light"] .badge-crack{color:#6a2fce}
  @media(prefers-color-scheme:light){:root:not([data-theme="dark"]) .badge-crack{color:#6a2fce}}
  .trend-up{color:var(--good);font-weight:700}
  .trend-dn{color:var(--bad);font-weight:700}

  .selrow{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-bottom:16px}
  select.fm{font-family:var(--font-disp);font-weight:700;font-stretch:condensed;text-transform:uppercase;letter-spacing:.04em;background:var(--surface-2);color:var(--ink);border:1px solid var(--line);border-radius:9px;padding:8px 12px;font-size:15px}
  .lineup-slot{display:flex;align-items:center;gap:10px;padding:8px 10px;border-bottom:1px solid var(--line-soft)}
  .lineup-slot select{flex:1;background:var(--surface-2);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:7px 9px;font-size:13px;font-family:var(--font-body)}
  .slot-lab{font-family:var(--font-disp);font-weight:800;width:34px;text-align:center;color:var(--faint);font-size:13px}

  .focusrow{display:flex;gap:8px;flex-wrap:wrap}
  .focusbtn{flex:1;min-width:92px;background:var(--surface-2);border:1px solid var(--line);border-radius:11px;padding:12px;cursor:pointer;color:var(--ink);text-align:center}
  .focusbtn:hover{border-color:var(--grass)}
  .focusbtn.on{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent) inset}
  .focusbtn .fl{font-family:var(--font-disp);font-weight:800;font-size:18px}
  .focusbtn .fs{font-size:11px;color:var(--muted)}
  .intens{display:flex;gap:6px}
  .intens button{flex:1;background:var(--surface-2);border:1px solid var(--line);border-radius:9px;padding:8px;cursor:pointer;color:var(--ink);font-family:var(--font-disp);font-weight:700;font-stretch:condensed;text-transform:uppercase;font-size:14px}
  .intens button.on{border-color:var(--gold);color:var(--gold-ink);box-shadow:0 0 0 1px var(--gold) inset}

  .results{display:flex;flex-direction:column;gap:8px}
  .match{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:12px;background:var(--surface-2);border:1px solid var(--line-soft);border-radius:11px;padding:10px 14px}
  .match .h{display:flex;align-items:center;gap:8px;justify-content:flex-end;text-align:right}
  .match .a{display:flex;align-items:center;gap:8px}
  .match .sc{font-family:var(--font-disp);font-weight:800;font-size:22px;font-variant-numeric:tabular-nums;background:var(--bg);border-radius:8px;padding:3px 12px;min-width:64px;text-align:center}
  .match.you{border-color:var(--grass);box-shadow:0 0 0 1px var(--grass) inset}
  .match .tn{font-weight:600;font-size:14px}
  @media(max-width:560px){.match .tn{font-size:12px}}
  .events{grid-column:1/-1;border-top:1px dashed var(--line);margin-top:8px;padding-top:8px;font-size:13px;color:var(--muted);display:flex;flex-direction:column;gap:3px}
  .events .ev{display:flex;gap:8px}
  .events .min{font-family:var(--font-mono);color:var(--faint);width:34px}

  .teamgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:14px}
  .teamopt{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;cursor:pointer;text-align:left;transition:transform .08s,border-color .12s;color:var(--ink);display:flex;gap:14px;align-items:center}
  .teamopt:hover{border-color:var(--grass);transform:translateY(-2px)}
  .teamopt .info h3{margin:0;font-family:var(--font-disp);font-weight:800;font-stretch:condensed;font-size:19px}
  .teamopt .info .meta{font-size:12px;color:var(--muted)}
  .stars{color:var(--gold-ink);letter-spacing:2px;font-size:13px}

  .hero{text-align:center;padding:40px 20px 10px}
  .hero h2{font-family:var(--font-disp);font-weight:800;font-stretch:condensed;text-transform:uppercase;letter-spacing:.04em;font-size:34px;margin:14px 0 6px}
  .hero p{color:var(--muted);max-width:520px;margin:0 auto 8px}

  .banner{background:var(--surface);border:1px solid var(--gold);border-radius:14px;padding:18px 20px;display:flex;align-items:center;gap:16px;margin-bottom:18px;flex-wrap:wrap}
  .banner .big{font-family:var(--font-disp);font-weight:800;font-stretch:condensed;font-size:26px;text-transform:uppercase}
  .form-badge{display:inline-flex;gap:3px}
  .form-badge b{width:16px;height:16px;border-radius:4px;font-size:10px;color:#fff;text-align:center;line-height:16px;font-family:var(--font-disp);font-weight:800}
  .fb-W{background:var(--good)}.fb-D{background:var(--faint)}.fb-L{background:var(--bad)}

  .prospect{display:flex;align-items:center;gap:12px;padding:12px;border:1px solid var(--line-soft);border-radius:12px;background:var(--surface-2);margin-bottom:10px;flex-wrap:wrap}
  .prospect .who{flex:1;min-width:150px}
  .prospect .who .nm{font-weight:600}
  .prospect .who .mt{font-size:12px;color:var(--muted)}
  .devnote{background:color-mix(in srgb,var(--grass) 10%,transparent);border:1px solid var(--grass);border-radius:12px;padding:12px 16px;margin-bottom:16px}
  .devnote .dt{font-family:var(--font-disp);font-weight:800;font-stretch:condensed;text-transform:uppercase;color:var(--grass-ink);font-size:14px;letter-spacing:.05em}
  .devlist{display:flex;flex-wrap:wrap;gap:6px 14px;margin-top:6px;font-size:13px}
  .foot{text-align:center;color:var(--faint);font-size:12px;margin-top:30px}
  .sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
  .empty{color:var(--muted);text-align:center;padding:30px;border:1px dashed var(--line);border-radius:12px}

  .nextmatch{background:var(--surface);border:1px solid var(--line);box-shadow:inset 4px 0 0 var(--accent);border-radius:12px;padding:10px 16px 12px;margin-bottom:18px}
  .nm-lab{font-family:var(--font-disp);font-weight:700;font-stretch:condensed;text-transform:uppercase;letter-spacing:.06em;color:var(--faint);font-size:12px;margin-bottom:6px}
  .nm-teams{display:flex;align-items:center;gap:16px;flex-wrap:wrap}
  .nm-side{display:flex;align-items:center;gap:8px;font-weight:600}
  .nm-vs{font-family:var(--font-disp);font-weight:800;color:var(--accent-ink);font-size:18px}
  .linebar{display:flex;align-items:center;gap:10px;margin:9px 0}
  .linebar .ll{font-family:var(--font-disp);font-weight:800;font-stretch:condensed;text-transform:uppercase;letter-spacing:.04em;width:78px;font-size:13px;color:var(--muted)}
  .linebar .track{flex:1;height:10px;background:var(--surface-3);border-radius:6px;overflow:hidden}
  .linebar .fill{height:100%;border-radius:6px}
  .linebar .lv{font-family:var(--font-mono);font-variant-numeric:tabular-nums;width:28px;text-align:right;font-weight:700;font-size:14px}
  .slot-meta{display:flex;align-items:center;gap:6px;min-width:96px;justify-content:flex-end}
  .relbtn{background:none;border:1px solid var(--line);color:var(--faint);border-radius:7px;width:28px;height:28px;cursor:pointer;font-size:13px;line-height:1}
  .relbtn:hover{border-color:var(--bad);color:var(--bad)}
  .confbtn{font-family:var(--font-disp);font-weight:800;font-size:12px;border-radius:7px;padding:4px 10px;cursor:pointer;border:1px solid var(--line);background:var(--surface-2);color:var(--ink)}
  .confbtn.yes{border-color:var(--bad);color:var(--bad)}

  /* ---- móvil: compactar para que se vea bien en el iPhone ---- */
  @media(max-width:600px){
    .wrap{padding:0 12px 90px}
    .topbar-in{padding:8px 12px;gap:8px}
    .brand .ik{height:24px;width:24px}
    .brand h1{font-size:20px}
    .brand .kick{font-size:10px}
    .hud{gap:6px;width:100%;order:3;overflow-x:auto;flex-wrap:nowrap;-webkit-overflow-scrolling:touch;padding-bottom:2px}
    .hud .chip{padding:4px 9px;min-width:0;flex:0 0 auto}
    .hud .chip .val{font-size:15px}
    #simBtn{order:2;margin-left:auto;padding:9px 12px;font-size:14px}
    .iconbtn{width:34px;height:34px;font-size:15px}
    .sect-title{font-size:18px}
    .grid2{gap:12px}
    .card{border-radius:12px}
    th,td{padding:7px 7px;font-size:13px}
    .match{padding:8px 10px;gap:8px}
    .match .sc{font-size:19px;min-width:54px}
    .nextmatch{padding:9px 12px 10px}
    .teamgrid{grid-template-columns:1fr 1fr;gap:8px}
    .teamopt{padding:10px;gap:8px}
    .teamopt .info h3{font-size:16px}
  }
  @media(max-width:380px){ .teamgrid{grid-template-columns:1fr} }
</style>

</head>
<body>
<div class="app">
  <h2 class="sr-only">Euskal Liga Manager: gestor deportivo de una liga vasca con entrenamiento y cantera al estilo Hattrick.</h2>
  <div class="topbar">
    <div class="topbar-in">
      <div class="brand">
        <div class="ik"><span class="r"></span><span class="w"></span><span class="g"></span></div>
        <div><div class="kick">Euskal Liga</div><h1>Manager</h1></div>
      </div>
      <div class="hud" id="hud"></div>
      <button class="iconbtn" id="saveBtn" aria-label="Exportar partida" title="Exportar partida a fichero">💾</button>
      <button class="iconbtn" id="importBtn" aria-label="Importar partida" title="Importar partida de fichero">📥</button>
      <button class="iconbtn" id="newBtn2" aria-label="Nueva partida" title="Nueva partida">＋</button>
      <button class="iconbtn" id="themeBtn" aria-label="Cambiar tema" title="Cambiar tema">◐</button>
      <input type="file" id="importFile" accept="application/json,.json" style="display:none">
    </div>
  </div>
  <div class="wrap" id="root"></div>
</div>

<script>
"use strict";
/* ---------- datos base ---------- */
const DIV_NAMES=["","Primera","Segunda","Tercera","Cuarta","Quinta","Sexta","Séptima","Octava"];
const N2STR=n=>Math.round(42+(n-1)*5.3); // escala del usuario (1-10) -> fuerza interna
// [id, nombre, corto, n(1-10), división, abbr, color1, color2, senior(id del equipo superior si es filial)]
const RAW_TEAMS=[
  ["rso","Real Sociedad","Real Sociedad",10,1,"RSO","#0067b1","#ffffff",null],
  ["ath","Athletic Club","Athletic",10,1,"ATH","#ee2523","#ffffff",null],
  ["osa","C.A. Osasuna","Osasuna",9,1,"OSA","#0a1e3c","#d81e05",null],
  ["ala","Deportivo Alavés","Alavés",9,1,"ALA","#0761af","#ffffff",null],
  ["eib","SD Eibar","Eibar",8,1,"EIB","#1c2b6b","#a41e22",null],
  ["bar","Barakaldo CF","Barakaldo",7,1,"BAR","#f2c200","#1a1a1a",null],
  ["uni","Real Unión","Real Unión",7,1,"UNI","#1a1a1a","#ffffff",null],
  ["are","Arenas de Getxo","Arenas",7,1,"ARE","#c8102e","#1a1a1a",null],
  ["rso_b","Real Sociedad B","Real Sociedad B",8,2,"RSB","#0067b1","#ffffff","rso"],

function schedule(ids){

  const n=t.length,rounds=n-1,half=n/2;const first=[];let arr=t.slice();

/* ---------- simulación ---------- */
function xiRating(team,xiIds,form,big){
  const map={};team.players.forEach(p=>map[p.id]=p);
  let xi=xiIds.map(id=>map[id]).filter(Boolean);
  if(xi.length<11){const rest=team.players.filter(p=>!xiIds.includes(p.id)).sort((a,b)=>eff(b)-eff(a));while(xi.length<11&&rest.length)xi.push(rest.shift());}
  const slots=form?expandForm(form):xi.map(p=>p.pos); // sin form (IA): cada uno en su puesto natural
  let defSum=0,defN=0,attSum=0,attN=0,allSum=0,hasLider=false;
  xi.forEach((p,i)=>{
    const slot=slots[i]||p.pos;
    let pen=outPen(p.pos,slot);
    if(p.esp==="rapido"&&pen<1)pen=Math.min(1,pen+0.15); // se adapta mejor fuera de su puesto
    const val=slotSkill(p,slot,true)*pen*espSectorMult(p,slot,big)*5; // habilidad del hueco * compatibilidad * especialidad * 5
    allSum+=val;
    if(p.esp==="lider")hasLider=true;
    if(slot==="GK"||slot==="DF"){defSum+=val;defN++;}else{attSum+=val;attN++;}
  });
  const lb=hasLider?1.03:1; // un líder en el campo tira del equipo
  const cb=captainMult(matchCaptain(team,xiIds),big); // el brazalete del capitán de ESTA alineación
  const tb=lb*cb;
  const avg=allSum/xi.length*tb;
  return {avg,attR:(attN?attSum/attN:avg)*tb,defR:(defN?defSum/defN:avg)*tb,xi};
}
function poisson(l){const L=Math.exp(-l);let k=0,p=1;do{k++;p*=Math.random();}while(p>L);return k-1;}
function xiEff(id){const t=S.teams[id];const xi=id===S.user?S.lineupMid.xi:bestXI(t.players,t.form);return xiRating(t,xi).avg;}
// resuelve una eliminatoria sin empates: si hay igualdad -> prórroga y, si sigue, penaltis. Devuelve goles finales, ganador y modo.
function decideTie(a,b,ga,gb){
  if(ga!==gb)return {winner:ga>gb?a:b,mode:"normal",ga,gb};
  const d=xiEff(a)-xiEff(b);
  const ea=poisson(Math.max(0.12,0.55+d*0.02)), eb=poisson(Math.max(0.12,0.55-d*0.02)); // prórroga
  ga+=ea;gb+=eb;
  if(ga!==gb)return {winner:ga>gb?a:b,mode:"prorroga",ga,gb};
  // penaltis: el portero parapenaltis del rival baja tu acierto; especialista en penaltis / sangre fría lo suben
  const savA=keeperHasEsp(S.teams[b],"parapenaltis")?0.07:0, savB=keeperHasEsp(S.teams[a],"parapenaltis")?0.07:0;
  const edgeA=penEdge(a), edgeB=penEdge(b);
  let pa=0,pb=0;
  for(let i=0;i<5;i++){if(Math.random()<0.75+d*0.004-savA+edgeA)pa++;if(Math.random()<0.75-d*0.004-savB+edgeB)pb++;}
  while(pa===pb){if(Math.random()<0.5+d*0.008+(edgeA-edgeB))pa++;else pb++;}
  return {winner:pa>pb?a:b,mode:"penaltis",ga,gb,pa,pb};
}
function penEdge(id){const t=S.teams[id];let e=0;if(teamHasEsp(t,"penaltis"))e+=0.05;if(teamHasEsp(t,"sangrefria"))e+=0.03;
  // el temple del capitán (para el usuario, el del once de entre semana: las copas se juegan a media semana)
  let cap;if(id===S.user){const c=S.lineupMid.captain;cap=c&&t.players.find(p=>p.id===c);}else{cap=t.players.slice().sort((a,b)=>captainScore(b)-captainScore(a))[0];}
  e+=0.04*capQ(cap||null);return e;}
/* ---------- balón parado: duelo del lanzador (según la alineación) contra la portería del meta ---------- */
function bestKeeper(xi){const gk=xi.filter(p=>p.pos==="GK");return (gk.length?gk:xi).slice().sort((a,b)=>sk(b,"por",true)-sk(a,"por",true))[0];}
function setPieces(team,xi,oppXi,origIds){
  const gk=bestKeeper(oppXi), kpr=gk?sk(gk,"por",true):8, para=gk&&gk.esp==="parapenaltis";
  const oppMuro=oppXi.some(p=>p.esp==="muro");
  const events=[];let goals=0;
  const nFalta=poisson(0.8), nPen=(Math.random()<0.15)?1:0; // faltas peligrosas + (a veces) un penalti
  for(let i=0;i<nFalta;i++){
    const tk=matchTaker(team,origIds,"falta");if(!tk)break;
    const p=Math.max(0.02,Math.min(0.28, 0.05+sk(tk,"tl",true)*0.007-kpr*0.004+(tk.esp==="balon"?0.03:0)));
    if(Math.random()<p){ goals++; let who=tk.id,assist=null;
      const cab=xi.filter(p2=>p2.esp==="cabeceador"&&p2.id!==tk.id).sort((a,b)=>sk(b,"ano",true)-sk(a,"ano",true))[0]; // remate de cabeza a la salida
      if(cab&&Math.random()<(oppMuro?0.28:0.5)){who=cab.id;assist=tk.id;}
      events.push({min:1+rnd(93),team:team.id,who,assist,sp:"falta"});
    }
  }
  for(let i=0;i<nPen;i++){
    const tk=matchTaker(team,origIds,"penalti");if(!tk)break;
    const p=Math.max(0.5,Math.min(0.92, 0.72+sk(tk,"tl",true)*0.006-kpr*0.002-(para?0.12:0)+(tk.esp==="penaltis"?0.05:0)));
    if(Math.random()<p){ goals++; events.push({min:1+rnd(93),team:team.id,who:tk.id,assist:null,sp:"penalti"}); }
  }
  return {goals,events};
}
function simMatch(homeId,awayId,homeXi,awayXi,homeForm,awayForm,big){
  const H=S.teams[homeId],A=S.teams[awayId];
  const hr=xiRating(H,homeXi,homeForm,big),ar=xiRating(A,awayXi,awayForm,big);
  const HOME=3.2, OP=0.84; // parte del gol llega por balón parado; el juego abierto se escala para no descuadrar el total
  const dh=(hr.attR-ar.defR)+HOME, da=(ar.attR-hr.defR)-HOME*0.5;
  const xgH=Math.max(0.18,Math.min(4.4,1.35+dh*0.055))*OP;
  const xgA=Math.max(0.14,Math.min(4.0,1.15+da*0.055))*OP;
  const ghOpen=poisson(xgH),gaOpen=poisson(xgA);
  const spH=setPieces(H,hr.xi,ar.xi,homeXi), spA=setPieces(A,ar.xi,hr.xi,awayXi); // faltas/penaltis, lanzador (según alineación) vs portero rival
  const evs=makeEvents(H,hr.xi,ghOpen,A,ar.xi,gaOpen).concat(spH.events,spA.events).sort((a,b)=>a.min-b.min);
  return {homeId,awayId,gh:ghOpen+spH.goals,ga:gaOpen+spA.goals,events:evs};
}
function pickW(arr,wf){const w=arr.map(wf);const tot=w.reduce((a,b)=>a+b,0);if(tot<=0)return arr[rnd(arr.length)];let r=Math.random()*tot;for(let i=0;i<arr.length;i++){r-=w[i];if(r<=0)return arr[i];}return arr[arr.length-1];}
function scorer(xi){return pickW(xi,p=>Math.pow(sk(p,"ano",true),2)*(p.pos==="FW"?1.6:p.pos==="MF"?1:p.pos==="DF"?0.35:0.05)*(p.esp==="killer"?2.2:1));} // marca según anotación (el killer del área remata todo)
function assister(xi,scId){const cand=xi.filter(p=>p.id!==scId);if(!cand.length)return null;return pickW(cand,p=>Math.pow(sk(p,"pas",true),2)*(p.pos==="MF"?1.4:p.pos==="FW"?1:p.pos==="DF"?0.7:0.1)*(p.esp==="centros"?1.6:p.esp==="extremo"?1.5:1)).id;} // asiste según pases (centros y extremos, más)
function bestBalon(xi){const b=xi.filter(p=>p.esp==="balon");return b.length?b.sort((a,c)=>sk(c,"tl",true)-sk(a,"tl",true))[0]:null;}
function makeEvents(H,hXi,gh,A,aXi,ga){ // solo goles de juego abierto (el balón parado lo genera setPieces)
  const one=(team,xi)=>{const sc=scorer(xi);return {min:1+rnd(93),team:team.id,who:sc.id,assist:assister(xi,sc.id),sp:false};};
  const evs=[];
  for(let i=0;i<gh;i++)evs.push(one(H,hXi));
  for(let i=0;i<ga;i++)evs.push(one(A,aXi));
  return evs;
}
function applyResult(r){
  const H=S.teams[r.homeId],A=S.teams[r.awayId];
  H.pj++;A.pj++;H.gf+=r.gh;H.gc+=r.ga;A.gf+=r.ga;A.gc+=r.gh;
  if(r.gh>r.ga){H.g++;A.p++;H.pts+=3;H.hist.push("W");A.hist.push("L");}
  else if(r.gh<r.ga){A.g++;H.p++;A.pts+=3;A.hist.push("W");H.hist.push("L");}
  else{H.e++;A.e++;H.pts++;A.pts++;H.hist.push("D");A.hist.push("D");}
  r.events.forEach(e=>{const T=S.teams[e.team];const pl=T.players.find(p=>p.id===e.who);if(pl)pl.goles++;if(e.assist){const ap=T.players.find(p=>p.id===e.assist);if(ap)ap.asis=(ap.asis||0)+1;}});
}

/* ---------- entrenamiento y cantera ---------- */
function ageMult(edad){
  // multiplicadores por edad: x2 hasta 22, x1,5 hasta 28, x1 hasta 32, después declive
  if(edad<=22)return 2;
  if(edad<=28)return 1.5;
  if(edad<=32)return 1;
  return 0;
}
function trainGain(p,role,mult){
  // role: 1 titular, 0.35 suplente, 0 no entrena
  if(role<=0||p.rating>=p.potencial)return 0;
  const am=ageMult(p.edad);if(am<=0)return 0;
  const gap=p.potencial-p.rating;
  return BASE_TRAIN*am*mult*role*Math.min(1,gap/6+0.35);
}
const COMP_MULT={liga:1,copa:2,amistoso:0.5}; // multiplicador de entrenamiento por competición
function trainFromGame(xiSet,compMult){
  // entrena solo a los que JUEGAN ese partido (los del once), del puesto en foco, escalado por competición
  const team=S.teams[S.user];
  const focus=S.training.focus, mult=INTENS[S.training.intensidad];
  const general=focus==="ALL", factor=general?GENERAL_FACTOR:1;
  team.players.forEach(p=>{
    if(!xiSet.has(p.id))return;
    if(!(general||p.pos===focus))return;
    p.rating=clampR(p.rating+trainGain(p,1,mult*factor*compMult));
  });
}
function weeklyDecline(){
  S.teams[S.user].players.forEach(p=>{if(p.edad>32)p.rating=clampR(p.rating-0.3);});
}
function gainExp(xiSet,mult){ // solo quien juega gana experiencia (liga x1 / amistoso x0,5 / copa x2 en Fase 2)
  S.teams[S.user].players.forEach(p=>{if(xiSet.has(p.id))p.exp=Math.min(400,(p.exp||0)+EXP_GAIN*mult);});

function academyTrain(){
  // los juveniles disputan su liguilla (2 partidos/semana, rotando, resultado irrelevante):
  // al JUGAR entrenan de verdad, así que suben rápido (multiplicadores por edad incluidos)
  const capId=S.lineup.captain, cap=capId&&S.teams[S.user].players.find(p=>p.id===capId); // el capitán de liga ejerce de mentor

}
const CANTERA_CAP=40;
const INVEST_BONUS={Baja:-6,Media:0,Alta:8}; // inversión en cantera: sube/baja el nivel de los juveniles
function canteraStr(){return clampR(S.teams[S.user].str+INVEST_BONUS[S.canteraInvest||"Media"]);}
function buildYouthPlan(){
  // 32 juveniles por temporada (uno por semana): 3 POR + resto ~40% DEF / 40% MED / 20% DEL
  const total=32;
  const plan=[];
  for(let i=0;i<3;i++)plan.push("GK");
  const fw=6+rnd(2);                        // 6-7 delanteros (~20%)
  for(let i=0;i<fw;i++)plan.push("FW");
  const rest=total-3-fw;                    // defensas + medios
  const df=Math.floor(rest/2)+rnd(2);
  const mf=rest-df;
  for(let i=0;i<df;i++)plan.push("DF");
  for(let i=0;i<mf;i++)plan.push("MF");
  return shuffle(plan);                     // orden aleatorio de aparición
}
function addYouths(batch){
  const before=new Set(S.cantera.map(p=>p.id)); // los que ya estaban (la hornada nueva no se recorta)
  S.cantera.push(...batch);
  while(S.cantera.length>CANTERA_CAP){ // los ojeadores descartan al de menor potencial entre los antiguos
    let wi=-1;
    for(let i=0;i<S.cantera.length;i++){if(!before.has(S.cantera[i].id))continue;if(wi<0||S.cantera[i].potencial<S.cantera[wi].potencial)wi=i;}
    if(wi<0)break;
    S.cantera.splice(wi,1);
  }
  return batch.map(p=>p.name);
}

function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=rnd(i+1);const t=a[i];a[i]=a[j];a[j]=t;}return a;}
function incAmis(a,b){(S.amistosoCount[a]=S.amistosoCount[a]||{})[b]=(S.amistosoCount[a][b]||0)+1;(S.amistosoCount[b]=S.amistosoCount[b]||{})[a]=(S.amistosoCount[b][a]||0)+1;}
function pairFriendlies(ids){
  const order=shuffle(ids);const used=new Set();const pairs=[];
  for(const id of order){
    if(used.has(id))continue;
    let best=null,bc=Infinity;
    for(const o of order){if(o===id||used.has(o))continue;const c=(S.amistosoCount[id]&&S.amistosoCount[id][o])||0;if(c<bc){bc=c;best=o;}}
    if(best!==null){used.add(id);used.add(best);incAmis(id,best);pairs.push([id,best]);}
  }
  return pairs;
}

/* Copa: 54 no-filiales, previa (ida/vuelta, los 44 más flojos) + KO sorteo puro ida/vuelta, final a partido único */
function makeTies(ids){const t=[];for(let i=0;i+1<ids.length;i+=2)t.push({a:ids[i],b:ids[i+1],ga:0,gb:0});return t;}
function initCopa(){

function playCopa(single,leg){
  const rows=[];const decides=single||leg===1;
  S.copa.ties.forEach(t=>{
    const home=single?t.a:(leg===0?t.a:t.b), away=single?t.b:(leg===0?t.b:t.a);

function resolveCopa(single){

/* Copa de la Liga: 9 grupos de 6 (botes por fuerza) -> 32 a KO sembrado a partido único (campo del de menor división) */
function seedOrder(n){let o=[1];while(o.length<n){const m=o.length*2;const nx=[];o.forEach(s=>{nx.push(s);nx.push(m+1-s);});o=nx;}return o;}
function rrSchedule(ids){const t=ids.slice();const n=t.length;const rounds=[];for(let r=0;r<n-1;r++){const day=[];for(let i=0;i<n/2;i++)day.push([t[i],t[n-1-i]]);rounds.push(day);t.splice(1,0,t.pop());}return rounds;}
function makeKOTies(arr){const t=[];for(let i=0;i+1<arr.length;i+=2)t.push({a:arr[i],b:arr[i+1]});return t;}
function lowerHome(x,y){return S.teams[x].div>=S.teams[y].div?x:y;} // el de menor categoría (div mayor) juega en casa
function initCopaLiga(){
  const elig=Object.values(S.teams).filter(t=>!t.filial).map(t=>t.id).sort((a,b)=>S.teams[b].str-S.teams[a].str);
  const pots=[];for(let p=0;p<6;p++)pots.push(shuffle(elig.slice(p*9,p*9+9)));
  const groups=[];for(let g=0;g<9;g++){const ids=[];for(let p=0;p<6;p++)ids.push(pots[p][g]);const table={};ids.forEach(id=>table[id]={pts:0,g:0,e:0,p:0,gf:0,gc:0});groups.push({ids,table,sched:rrSchedule(ids)});}
  S.copaliga={phase:"grupos",groups,ties:null,stage:null,champion:null,finalists:[],ranked:null};
}
function playCLGroups(md){
  const rows=[];
  S.copaliga.groups.forEach(gr=>{gr.sched[md].forEach(([x,y])=>{
    const home=lowerHome(x,y),away=home===x?y:x;
    const hXi=home===S.user?S.lineupMid.xi:bestXI(S.teams[home].players,S.teams[home].form);
    const aXi=away===S.user?S.lineupMid.xi:bestXI(S.teams[away].players,S.teams[away].form);
    const r=simMatch(home,away,hXi,aXi,home===S.user?S.lineupMid.form:undefined,away===S.user?S.lineupMid.form:undefined);const T=gr.table;
    T[home].gf+=r.gh;T[home].gc+=r.ga;T[away].gf+=r.ga;T[away].gc+=r.gh;
    if(r.gh>r.ga){T[home].g++;T[home].pts+=3;T[away].p++;}else if(r.gh<r.ga){T[away].g++;T[away].pts+=3;T[home].p++;}else{T[home].e++;T[away].e++;T[home].pts++;T[away].pts++;}
    rows.push({homeId:home,awayId:away,gh:r.gh,ga:r.ga,events:r.events});
  });});
  return rows;
}
function clGroupSorted(gr){return gr.ids.slice().sort((a,b)=>{const A=gr.table[a],B=gr.table[b];return B.pts-A.pts||((B.gf-B.gc)-(A.gf-A.gc))||(B.gf-A.gf);});}
function buildCLBracket(){
  const info=[];
  S.copaliga.groups.forEach(gr=>{clGroupSorted(gr).forEach((id,i)=>{const t=gr.table[id];info.push({id,pos:i+1,pts:t.pts,gd:t.gf-t.gc,gf:t.gf});});});
  const cmp=(a,b)=>b.pts-a.pts||b.gd-a.gd||b.gf-a.gf;
  const byPos=p=>info.filter(x=>x.pos===p).sort(cmp);
  const ranked=[].concat(byPos(1),byPos(2),byPos(3),byPos(4).slice(0,5)).map(x=>x.id); // 9+9+9+5 = 32
  const arr=seedOrder(32).map(s=>ranked[s-1]); // orden de cuadro (los primeros de grupo, mejor sembrados, se cruzan tarde)
  S.copaliga.ranked=ranked;S.copaliga.ties=makeKOTies(arr);S.copaliga.stage="r32";S.copaliga.phase="ko";
}
function playCLKO(){
  const rows=[],winners=[];const cl=S.copaliga;
  cl.ties.forEach(t=>{
    const home=lowerHome(t.a,t.b),away=home===t.a?t.b:t.a;
    const hXi=home===S.user?S.lineupMid.xi:bestXI(S.teams[home].players,S.teams[home].form);
    const aXi=away===S.user?S.lineupMid.xi:bestXI(S.teams[away].players,S.teams[away].form);
    const r=simMatch(home,away,hXi,aXi,home===S.user?S.lineupMid.form:undefined,away===S.user?S.lineupMid.form:undefined,true);
    const ga=home===t.a?r.gh:r.ga, gb=home===t.a?r.ga:r.gh;
    const dec=decideTie(t.a,t.b,ga,gb);
    t.sh=dec.ga;t.sa=dec.gb;t.winner=dec.winner;t.mode=dec.mode;t.pa=dec.pa;t.pb=dec.pb;winners.push(dec.winner);
    rows.push({homeId:home,awayId:away,gh:r.gh,ga:r.ga,events:r.events,tie:t,decidesTie:true});
  });
  if(cl.stage==="final"){cl.champion=winners[0];S.copaLigaChamp=winners[0];S.teams[winners[0]].palmares.copaliga++;return rows;}
  if(cl.stage==="r4"){cl.finalists=winners.slice();cl.ties=makeKOTies(winners);cl.stage="final";return rows;}
  const next={r32:"r16",r16:"r8",r8:"r4"};cl.ties=makeKOTies(winners);cl.stage=next[cl.stage];
  return rows;
}
/* Supercopa: 1º y 2º de Primera vs campeón de Copa y campeón de Copa de la Liga (con sustituciones); neutral, partido único */
function buildSuper(){
  const st=standings(1);const parts=[st[0].id,st[1].id];
  const addCup=(champ,finalists)=>{
    let cand=champ;
    if(cand&&parts.includes(cand))cand=(finalists||[]).find(f=>f!==champ); // subcampeón
    if(!cand||parts.includes(cand))cand=st.map(t=>t.id).find(id=>!parts.includes(id)); // 3º/4º libre
    parts.push(cand);
  };
  addCup(S.copaChamp,S.copa&&S.copa.finalists);
  addCup(S.copaLigaChamp,S.copaliga&&S.copaliga.finalists);
  const d=shuffle(parts);
  S.super={parts,semis:[{a:d[0],b:d[1]},{a:d[2],b:d[3]}],final:null,stage:"semi",champion:null};
}
function playSuperTies(ties){
  return ties.map(t=>{
    const hXi=t.a===S.user?S.lineupMid.xi:bestXI(S.teams[t.a].players,S.teams[t.a].form);
    const aXi=t.b===S.user?S.lineupMid.xi:bestXI(S.teams[t.b].players,S.teams[t.b].form);
    const r=simMatch(t.a,t.b,hXi,aXi,t.a===S.user?S.lineupMid.form:undefined,t.b===S.user?S.lineupMid.form:undefined,true); // campo neutral
    const dec=decideTie(t.a,t.b,r.gh,r.ga);
    t.sh=dec.ga;t.sa=dec.gb;t.winner=dec.winner;t.mode=dec.mode;t.pa=dec.pa;t.pb=dec.pb;
    return {homeId:t.a,awayId:t.b,gh:r.gh,ga:r.ga,events:r.events,tie:t,decidesTie:true};
  });
}
function playSuper(){
  const sc=S.super;
  if(sc.stage==="semi"){
    const rows=playSuperTies(sc.semis);
    sc.final={a:sc.semis[0].winner,b:sc.semis[1].winner};sc.stage="final";
    return rows;
  }
  const rows=playSuperTies([sc.final]);
  sc.champion=sc.final.winner;S.superChamp=sc.champion;S.teams[sc.champion].palmares.super++;
  return rows;
}
function simMidweek(w){
  const d=MIDCAL[w];const out={desc:d,label:"Amistoso",cupRows:[],amisRows:[],userComp:"amistoso",justChamp:null};
  const busy=new Set();const mark=rows=>rows.forEach(r=>{busy.add(r.homeId);busy.add(r.awayId);});
  if(d.type==="copa"){
    if(w===1)initCopa();
    out.cupRows=playCopa(!!d.single,d.leg||0);mark(out.cupRows);
    out.label=`Copa · ${COPA_ROUND_NAMES[S.copa.stage]}${d.single?"":d.leg===0?" (ida)":" (vuelta)"}`;
    if(d.single){resolveCopa(true);out.justChamp={comp:"Copa",id:S.copaChamp};}else if(d.leg===1)resolveCopa(false);
  }else if(d.type==="copaliga"){
    if(d.stage==="g"){
      if(d.md===0)initCopaLiga();
      out.cupRows=playCLGroups(d.md);mark(out.cupRows);
      out.label=`Copa de la Liga · Fase de grupos (J${d.md+1}/5)`;
    }else{
      if(d.ko==="r32")buildCLBracket();
      out.label=`Copa de la Liga · ${CL_ROUND_NAMES[S.copaliga.stage]}`;
      const wasFinal=S.copaliga.stage==="final";
      out.cupRows=playCLKO();mark(out.cupRows);
      if(wasFinal)out.justChamp={comp:"Copa de la Liga",id:S.copaLigaChamp};
    }
  }else if(d.type==="super"){
    if(d.stage==="semi")buildSuper();
    out.label=`Supercopa · ${S.super.stage==="final"?"Final":"Semifinales"}`;
    const wasFinal=S.super.stage==="final";
    out.cupRows=playSuper();mark(out.cupRows);
    if(wasFinal)out.justChamp={comp:"Supercopa",id:S.superChamp};
  }
  out.amisRows=allFriendlies(Object.keys(S.teams).filter(id=>!busy.has(id)));
  if(out.cupRows.some(r=>r.homeId===S.user||r.awayId===S.user))out.userComp="copa"; // cualquier copa entrena x2
  return out;
}

/* ---------- ciclo de semana / temporada (32 semanas) ---------- */
function simJornada(){
  if(S.finished)return;
  const w=S.jornada,lr=leagueRound(w),team=S.teams[S.user];
  const before={};team.players.forEach(p=>before[p.id]=nivel(p));
  const ligaSet=new Set(S.lineup.xi), midSet=new Set(S.lineupMid.xi);
  // Fin de semana: liga (w2-29) o amistoso (semanas sin liga)
  let res=null,weekendAmis=null,weekendComp="amistoso";
  if(lr>=0){
    res={};
    for(let div=1;div<=NDIV;div++){res[div]=[];for(const [h,a] of S.leagueCal[div][lr]){const hXi=h===S.user?S.lineup.xi:bestXI(S.teams[h].players,S.teams[h].form);const aXi=a===S.user?S.lineup.xi:bestXI(S.teams[a].players,S.teams[a].form);const r=simMatch(h,a,hXi,aXi,h===S.user?S.lineup.form:undefined,a===S.user?S.lineup.form:undefined);applyResult(r);res[div].push(r);}}
    weekendComp="liga";
  }else{
    weekendAmis=allFriendlies(Object.keys(S.teams));
  }
  trainFromGame(ligaSet,1);
  gainExp(ligaSet,weekendComp==="liga"?COMP_MULT.liga:COMP_MULT.amistoso);
  // Entre semana: copa o amistoso
  const mid=simMidweek(w);
  trainFromGame(midSet,1);
  gainExp(midSet,COMP_MULT[mid.userComp]||COMP_MULT.amistoso);
  weeklyDecline();
  const cBefore={};S.cantera.forEach(p=>cBefore[p.id]=nivel(p));
  academyTrain();
  const pos=S.youthPlan[w];
  let nuevos=[],crackName=null;
  if(pos){
    const isCrack=((w+1)%8===0); // crack cada 8 semanas -> 4 por temporada (sem 8,16,24,32), todos con especialidad
    let cpos=pos;
    if(isCrack){ // reparto 9/35/35/21, pero garantía de 1 portero cada 11 cracks
      const since=S.crackSinceGK||0;
      cpos=since>=10?"GK":crackPos();
      S.crackSinceGK=cpos==="GK"?0:since+1;
    }
    const p=genProspect(canteraStr(),cpos,isCrack);nuevos=addYouths([p]);if(isCrack&&S.cantera.includes(p))crackName=p.name;
  }
  const ups=[];team.players.forEach(p=>{const a=nivel(p);if(a!==before[p.id])ups.push({name:p.name,pos:p.pos,from:before[p.id],to:a,up:a>before[p.id]});});
  const canteraUps=S.cantera.filter(p=>cBefore[p.id]!==undefined&&nivel(p)>cBefore[p.id]).map(p=>({name:p.name,pos:p.pos,from:cBefore[p.id],to:nivel(p)}));
  S.lastDev={ups,nuevos,crack:crackName,canteraUps};
  S.lastResults={week:w,lr,results:res,weekendAmis,mid};
  if(lr>=0)S.history[lr]=res;
  S.jornada++;
  if(S.jornada>=NWEEKS)S.finished=true;
  S.screen="results";render();
}
function nRounds(){return 28;} // rondas de liga (la temporada dura 32 semanas)
function endSeasonDevelop(p){
  if(p.edad<=23&&p.rating<p.potencial)p.rating=Math.min(p.potencial,p.rating+1+Math.random()*1.5);
  else if(p.edad>=31)p.rating-=1+Math.random()*1.6;
  p.rating=clampR(p.rating);
}
const SQUAD_MIN=18; // ningún equipo baja de 18 jugadores
function maintainSquad(team){
  team.players=team.players.filter(p=>p.edad<35); // retiros
  const cnt=pos=>team.players.filter(p=>p.pos===pos).length;
  // 1) mínimos por puesto para poder alinear cualquier formación (no fuerza un 3er portero)
  ["GK","DF","MF","FW"].forEach(pos=>{while(cnt(pos)<MIN_POS[pos])team.players.push(regen(pos,team.str));});
  // 2) nunca menos de 18: completa SOLO con jugadores de campo (nunca porteros extra)
  const outfield=["DF","MF","FW"];
  while(team.players.length<SQUAD_MIN){
    let bp=outfield[0],bestDef=-Infinity;
    outfield.forEach(pos=>{const def=SQUAD_TARGET[pos]-cnt(pos);if(def>bestDef){bestDef=def;bp=pos;}});
    team.players.push(regen(bp,team.str));
  }
}
function promoteRelegate(){
  // clasificaciones previas (ids) por división
  const tables={};for(let d=1;d<=NDIV;d++)tables[d]=standings(d).map(t=>t.id);
  const newDiv={};Object.values(S.teams).forEach(t=>newDiv[t.id]=t.div);
  // filial no puede quedar en la misma división que su superior ni por encima
  const seniorDiv=id=>newDiv[S.teams[id].senior];
  for(let d=1;d<NDIV;d++){
    const upper=tables[d],lower=tables[d+1];
    // suben 2 de d+1 (elegibles): saltar filial cuyo superior quedaría en d o por encima
    const ups=[];
    for(const id of lower){ if(ups.length>=2)break;
      const t=S.teams[id];
      if(t.filial&&seniorDiv(id)<=d)continue;
      ups.push(id);
    }
    while(ups.length<2){for(const id of lower){if(!ups.includes(id)){ups.push(id);break;}}} // salvaguarda de cupo
    // bajan 2 de d: evitar que un superior baje a la división donde está su filial
    const downs=[];
    for(let i=upper.length-1;i>=0&&downs.length<2;i--){
      const id=upper[i];
      const clash=Object.values(S.teams).some(f=>f.filial&&f.senior===id&&newDiv[f.id]===d+1);
      if(clash)continue;
      downs.push(id);
    }
    while(downs.length<2){for(let i=upper.length-1;i>=0;i--){if(!downs.includes(upper[i])){downs.push(upper[i]);break;}}}
    ups.forEach(id=>newDiv[id]=d);
    downs.forEach(id=>newDiv[id]=d+1);
  }
  Object.values(S.teams).forEach(t=>{t.div=newDiv[t.id];});
}
function nuevaTemporada(){
  // títulos (Primera y Segunda) + palmarés
  const champ1=standings(1)[0], champ2=standings(2)[0];
  champ1.palmares.liga1++; champ2.palmares.liga2++;
  S.winners.push({temp:S.temporada,liga1:champ1.id,liga2:champ2.id,copa:S.copaChamp,copaliga:S.copaLigaChamp,super:S.superChamp});
  promoteRelegate();
  // envejecer y desarrollar
  Object.values(S.teams).forEach(t=>{
    const ai=t.id!==S.user;
    t.players.forEach(p=>{p.edad++;endSeasonDevelop(p);p.goles=0;p.asis=0;if(ai)p.exp=Math.min(400,(p.exp||0)+SEASON_EXP);}); // la IA gana experiencia por temporada
    maintainSquad(t);
    Object.assign(t,{pj:0,g:0,e:0,p:0,gf:0,gc:0,pts:0,hist:[]});
  });
  S.cantera.forEach(p=>{p.edad++;});
  S.cantera=S.cantera.filter(p=>p.edad<=20);
  S.temporada++;
  const leagueCal={};for(let d=1;d<=NDIV;d++)leagueCal[d]=schedule(divIds(d));
  S.leagueCal=leagueCal;
  S.jornada=0;S.finished=false;S.lastResults=null;S.lastDev=null;S.history={};
  S.amistosoCount={};S.youthPlan=buildYouthPlan();
  S.copa=null;S.copaChamp=null;S.copaliga=null;S.copaLigaChamp=null;S.super=null;S.superChamp=null;
  const u=S.teams[S.user];
  S.lineup={form:S.lineup.form,xi:bestXI(u.players,S.lineup.form)};
  S.lineupMid={form:S.lineupMid.form,xi:bestXI(u.players,S.lineupMid.form)};
  ensureLineupRoles(S.lineup,u.players);ensureLineupRoles(S.lineupMid,u.players);
  S.screen="squad";render();
}

/* ---------- clasificación ---------- */
function userDiv(){return S.teams[S.user].div;}
function standings(div){return Object.values(S.teams).filter(t=>t.div===div).sort((a,b)=>b.pts-a.pts||(b.gf-b.gc)-(a.gf-a.gc)||b.gf-a.gf||a.name.localeCompare(b.name));}
function userPos(){return standings(userDiv()).findIndex(t=>t.id===S.user)+1;}

/* ---------- helpers UI ---------- */
function crest(t,size){const s=size||34;return `<span class="crest" style="width:${s}px;height:${s}px;font-size:${s*0.42}px;background:linear-gradient(135deg,${t.c1} 0 50%,${t.c2} 50% 100%)"><span class="txt">${t.abbr}</span></span>`;}
function crestInline(t){return `<span class="crest" style="display:inline-flex;vertical-align:middle;width:26px;height:26px;font-size:11px;background:linear-gradient(135deg,${t.c1} 0 50%,${t.c2} 50% 100%)"><span class="txt">${t.abbr}</span></span>`;}
function ratColor(r){r=R(r);if(r>=82)return "background:color-mix(in srgb,var(--grass) 30%,transparent);color:var(--grass-ink)";if(r>=72)return "background:color-mix(in srgb,#5b8def 26%,transparent);color:#8fb4ff";if(r>=62)return "background:color-mix(in srgb,var(--gold) 26%,transparent);color:var(--gold-ink)";return "background:color-mix(in srgb,var(--bad) 22%,transparent);color:var(--bad)";}
function stars(str){const n=Math.max(1,Math.min(5,Math.round((str-52)/8)));return "★".repeat(n)+"☆".repeat(5-n);}
function potStars(pot){const n=Math.max(1,Math.min(5,Math.round((pot-52)/9)));return `<span class="potstars">${"★".repeat(n)}<span class="off">${"★".repeat(5-n)}</span></span>`;}
function formBadge(hist){const last=hist.slice(-5);if(!last.length)return '<span class="muted" style="font-size:12px">—</span>';return '<span class="form-badge">'+last.map(r=>`<b class="fb-${r}">${r}</b>`).join("")+'</span>';}
function isPromesa(p){return p.edad<=21&&(p.potencial-p.rating)>=8;}
function skColor(v){ // color por habilidad 1-20
  if(v>=16)return "background:color-mix(in srgb,var(--grass) 30%,transparent);color:var(--grass-ink)";
  if(v>=12)return "background:color-mix(in srgb,#5b8def 26%,transparent);color:#8fb4ff";
  if(v>=8)return "background:color-mix(in srgb,var(--gold) 26%,transparent);color:var(--gold-ink)";
  return "background:color-mix(in srgb,var(--bad) 22%,transparent);color:var(--bad)";}
function espBadge(p){return p.esp?`<span class="badge-crack" title="${ESP[p.esp]}">✦ ${ESP_SHORT[p.esp]}</span>`:"";}
function skillCells(p){return SKILL_KEYS.map(k=>`<td class="num" style="padding:6px 4px"><span style="display:inline-block;min-width:24px;border-radius:6px;padding:1px 0;font-weight:700;${skColor(sk(p,k,false))}">${sk(p,k,false)}</span></td>`).join("");}

function bindLineup(){
  document.querySelectorAll("[data-lutab]").forEach(b=>b.onclick=()=>{lineupTab=b.dataset.lutab;swapSel=null;swapMsg="";render();});

  const fs=document.getElementById("formSel");
  fs.onchange=()=>{lu.form=fs.value;lu.xi=bestXI(players,fs.value);ensureLineupRoles(lu,players);swapSel=null;swapMsg="";render();};
  document.getElementById("autoBtn").onclick=()=>{lu.xi=bestXI(players,lu.form);ensureLineupRoles(lu,players);swapSel=null;swapMsg="";render();};
  const anb=document.getElementById("autoNoBtn");
  if(anb)anb.onclick=()=>{ // alinea a los que NO son titulares en el once de liga (rotación)
    const starters=new Set(S.lineup.xi);
    const pool=players.filter(p=>!starters.has(p.id));
    lu.xi=bestXI(pool,lu.form);ensureLineupRoles(lu,players);swapSel=null;swapMsg="";render();
  };
  const cs=document.getElementById("capSel");if(cs)cs.onchange=()=>setLineupRole("captain",cs.value);
  const ts=document.getElementById("takerSel");if(ts)ts.onchange=()=>setLineupRole("taker",ts.value);
  document.querySelectorAll("[data-swap]").forEach(el=>el.onclick=()=>{
    const id=el.dataset.swap;
    if(!swapSel){swapSel=id;swapMsg="";render();return;}
    if(swapSel===id){swapSel=null;render();return;}
    const a=swapSel,b=id;swapSel=null;
    const xi=lu.xi.slice();const ia=xi.indexOf(a),ib=xi.indexOf(b);
    if(ia>-1&&ib>-1){const tmp=xi[ia];xi[ia]=xi[ib];xi[ib]=tmp;}
    else if(ia>-1)xi[ia]=b; else if(ib>-1)xi[ib]=a; else {render();return;}
    lu.xi=xi;ensureLineupRoles(lu,players);swapMsg="";render();
  });
}

function viewTraining(){
  const t=S.teams[S.user];const focus=S.training.focus;const mult=INTENS[S.training.intensidad];
  const general=focus==="ALL";const factor=general?GENERAL_FACTOR:1;
  const ligaSet=new Set(S.lineup.xi), midSet=new Set(S.lineupMid.xi);
  const midLabel="Amistoso";
  const gainOf=p=>{ // Fase 1: todos los partidos entrenan x1
    if(!(general||p.pos===focus))return {g:0,liga:false,mid:false};
    const gl=ligaSet.has(p.id)?trainGain(p,1,mult*factor):0;
    const gm=midSet.has(p.id)?trainGain(p,1,mult*factor):0;
    return {g:gl+gm,liga:ligaSet.has(p.id),mid:midSet.has(p.id)};
  };
  const foco=(general?t.players.slice():t.players.filter(p=>p.pos===focus)).sort((a,b)=>gainOf(b).g-gainOf(a).g);
  const rows=foco.map(p=>{
    const gi=gainOf(p);
    const proj=gi.g>0.05?`<span class="trend-up">+${gi.g.toFixed(2)}/sem</span>`:'<span class="muted">—</span>';
    const juega=[gi.liga?'<span class="pill" style="background:color-mix(in srgb,var(--grass) 20%,transparent);color:var(--grass-ink)">Liga</span>':'',
                 gi.mid?`<span class="pill" style="background:color-mix(in srgb,var(--gold) 20%,transparent);color:var(--gold-ink)">${midLabel}</span>`:''].filter(Boolean).join(" ")||'<span class="muted" style="font-size:12px">no juega</span>';
    return `<tr>
      <td class="nm" style="font-weight:600"><span class="pill p-${p.pos}">${p.pos}</span> ${p.name} ${isPromesa(p)?'<span class="badge-prom">PROMESA</span>':''}</td>
      <td class="num">${p.edad}</td>
      <td style="text-align:center"><span class="rating" style="${skColor(nivel(p))}">${nivel(p)}</span></td>
      <td>${potStars(p.potencial)}</td>
      <td>${juega}</td>
      <td style="text-align:right">${proj}</td>

  const focusDefs=[["GK","POR"],["DF","DEF"],["MF","MED"],["FW","DEL"],["ALL","GEN"]];
  const focusBtns=focusDefs.map(([f,short])=>`<button class="focusbtn ${f===focus?"on":""}" data-focus="${f}"><div class="fl">${short}</div><div class="fs">${f==="ALL"?"General":POS_LABEL[f]}</div></button>`).join("");
  const intBtns=Object.keys(INTENS).map(k=>`<button class="${k===S.training.intensidad?"on":""}" data-int="${k}">${k}</button>`).join("");
  return navHtml("training")+`

    <p class="sub">Elige un puesto, o <b>General</b> para que todos entrenen su propia posición. Solo entrena quien <b>juega</b> esa semana, y cunde según la competición: <b>liga ×1</b>, <b>copa ×2</b>, <b>amistoso ×0,5</b>. Un jugador puede sumar de su partido de liga y del de entre semana.</p>
    <div class="grid2">
      <div>
        <div class="focusrow" style="margin-bottom:12px">${focusBtns}</div>
        <div style="display:flex;align-items:center;gap:12px;margin-bottom:6px">
          <span class="muted" style="font-size:13px">Intensidad</span>
          <div class="intens" style="flex:1">${intBtns}</div>
        </div>
        <p class="muted" style="font-size:12px">Más intensidad = progreso más rápido. En un juego completo tendría coste de forma física; aquí de momento solo acelera el crecimiento.</p>
      </div>
      <div class="card" style="padding:16px">
        <div class="sect-title" style="font-size:15px;color:var(--faint)">Ritmo por edad</div>
        <p class="muted" style="font-size:13px;margin:8px 0">Entrenan <b>x2 hasta los 22</b>, <b>x1,5 hasta los 28</b>, <b>x1 hasta los 32</b> y a partir de ahí empiezan a <b>bajar</b> aunque entrenen.</p>

      </div>

    <h3 class="sect-title" style="font-size:16px;margin:20px 0 8px">Foco actual · ${general?"General (cada uno entrena su puesto)":POS_LABEL[focus]}</h3>
    <div class="card"><div class="tbl-scroll"><table>
      <thead><tr><th>Jugador</th><th class="num">Edad</th><th style="text-align:center">Media</th><th>Potencial</th><th>Juega esta semana</th><th style="text-align:right">Progreso previsto</th></tr></thead>

function cupCard(r,evUser){ // partido de copa en Resultados: marcador + ganador (negrita) + prórroga/penaltis + global si es a doble
  const H=S.teams[r.homeId],A=S.teams[r.awayId];const you=(r.homeId===S.user||r.awayId===S.user)?"you":"";

        <div class="kick" style="font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--gold-ink);font-weight:700">Fin de temporada ${S.temporada}</div>
        <div style="display:flex;align-items:center;gap:10px;margin-top:6px"><span class="pill" style="background:color-mix(in srgb,var(--gold) 22%,transparent);color:var(--gold-ink)">🏆 1ª</span> ${crest(c1,26)} <b>${c1.name}</b></div>
        <div style="display:flex;align-items:center;gap:10px;margin-top:6px"><span class="pill" style="background:color-mix(in srgb,var(--grass) 20%,transparent);color:var(--grass-ink)">↑ 2ª</span> ${crest(c2,26)} <b>${c2.name}</b> asciende</div>
        <div style="display:flex;align-items:center;gap:10px;margin-top:6px"><span class="pill" style="background:color-mix(in srgb,var(--bad) 18%,transparent);color:var(--bad)">↓ desc.</span> ${crest(releg,26)} <b>${releg.name}</b> baja a 2ª</div>
        ${S.copaChamp?`<div style="display:flex;align-items:center;gap:10px;margin-top:6px"><span class="pill" style="background:color-mix(in srgb,var(--accent) 18%,transparent);color:var(--accent-ink)">🏆 Copa</span> ${crest(S.teams[S.copaChamp],26)} <b>${S.teams[S.copaChamp].name}</b></div>`:""}
        ${S.copaLigaChamp?`<div style="display:flex;align-items:center;gap:10px;margin-top:6px"><span class="pill" style="background:color-mix(in srgb,#5b8def 22%,transparent);color:#8fb4ff">🏆 C.Liga</span> ${crest(S.teams[S.copaLigaChamp],26)} <b>${S.teams[S.copaLigaChamp].name}</b></div>`:""}
        ${S.superChamp?`<div style="display:flex;align-items:center;gap:10px;margin-top:6px"><span class="pill" style="background:color-mix(in srgb,#a06bff 30%,transparent);color:#c9a8ff">👑 Supercopa</span> ${crest(S.teams[S.superChamp],26)} <b>${S.teams[S.superChamp].name}</b> · campeón de campeones</div>`:""}
      </div>
      <div style="display:flex;gap:8px;flex-wrap:wrap">
        <button class="btn primary" id="newSeasonBtn">Nueva temporada →</button>
        <button class="btn sm" id="newClubBtn">Otro club</button>
      </div></div>`;
  }
  let devHtml="";
  const nuevos=(S.lastDev&&S.lastDev.nuevos)||[];
  const canteraUps=(S.lastDev&&S.lastDev.canteraUps)||[];
  if(S.lastDev&&(S.lastDev.ups.length||nuevos.length||canteraUps.length)){
    const ups=S.lastDev.ups.map(u=>`<span>${u.up?'<span class="trend-up">▲</span>':'<span class="trend-dn">▼</span>'} ${u.name} <span class="muted">(${u.pos})</span> ${u.from}→${u.to} <b class="${u.up?'trend-up':'trend-dn'}">(${u.up?'+':'−'}${Math.abs(u.to-u.from)})</b></span>`).join("");
    const cu=canteraUps.slice(0,14).map(u=>`<span><span class="trend-up">▲</span> ${u.name} <span class="muted">(${u.pos})</span> ${u.from}→${u.to} <b class="trend-up">(+${u.to-u.from})</b></span>`).join("");
    devHtml=`<div class="devnote"><div class="dt">Desarrollo de la semana</div>
      <div class="devlist">${ups||'<span class="muted">Sin cambios de media en el primer equipo.</span>'}</div>
      ${canteraUps.length?`<div style="margin-top:8px"><span class="muted" style="font-size:12px">🏋️ Cantera (juegan su liguilla y suben):</span><div class="devlist" style="margin-top:4px">${cu}</div></div>`:""}
      ${nuevos.length?`<div style="margin-top:8px;font-size:13px">${S.lastDev.crack?`💎 <b>¡CRACK de la cantera!</b> Ha aparecido <b>${S.lastDev.crack}</b> (potencial de estrella) — no lo dejes escapar, míralo en <b>Cantera</b>.`:`🌱 Nuevo juvenil en la cantera: <b>${nuevos.join(", ")}</b> — revísalo en <b>Cantera</b>.`}</div>`:""}</div>`;
  }
  const mCard=(r,sz,evUser)=>{
    const H=S.teams[r.homeId],A=S.teams[r.awayId];const you=(r.homeId===S.user||r.awayId===S.user)?"you":"";
    const ev=(evUser&&r.events&&r.events.length)?eventsHtml(r.events):"";
    return `<div class="match ${you}"><div class="h"><span class="tn">${H.short}</span>${crest(H,sz)}</div><span class="sc"${sz<26?' style="font-size:18px;min-width:56px"':''}>${r.gh} - ${r.ga}</span><div class="a">${crest(A,sz)}<span class="tn">${A.short}</span></div>${ev}</div>`;
  };
  // Fin de semana
  let weekendHtml;
  if(lr>=0){
    const cards=results[div].map(r=>mCard(r,26,r.homeId===S.user||r.awayId===S.user)).join("");
    weekendHtml=`<h2 class="sect-title">Semana ${week+1} · Liga ${DIV_NAMES[div]} <span class="muted" style="font-size:14px;font-weight:400">(jornada ${lr+1})</span></h2>
      <p class="sub">Los goles de tu partido se detallan con minuto y goleador.</p><div class="results">${cards}</div>`;
  }else{
    const ua=weekendAmis?weekendAmis.find(r=>r.homeId===S.user||r.awayId===S.user):null;
    weekendHtml=`<h2 class="sect-title">Semana ${week+1} · Amistoso <span class="muted" style="font-size:14px;font-weight:400">(sin liga)</span></h2>
      <div class="results">${ua?mCard(ua,26,true):'<div class="muted">—</div>'}</div>`;
  }
  // Entre semana
  let midHtml="";
  if(mid){
    const champLine=mid.justChamp?`<div class="devnote" style="border-color:var(--gold);background:color-mix(in srgb,var(--gold) 10%,transparent)"><div class="dt" style="color:var(--gold-ink)">🏆 ${mid.justChamp.comp} — ¡campeón!</div><div style="margin-top:4px;font-size:14px">${crestInline(S.teams[mid.justChamp.id])} <b>${S.teams[mid.justChamp.id].name}</b></div></div>`:"";
    const d=mid.desc;
    const showAll=d&&(d.type==="super"||(d.type==="copa"&&d.single)||(d.type==="copaliga"&&d.ko==="final")); // supercopa y finales las ve todo el mundo
    if(mid.userComp==="copa"){
      const yourGame=mid.cupRows.find(r=>r.homeId===S.user||r.awayId===S.user);
      const others=mid.cupRows.filter(r=>r!==yourGame).slice(0,8);
      midHtml=champLine+`<h3 class="sect-title" style="font-size:16px;margin:22px 0 8px">Entre semana · ${mid.label}</h3>
        <div class="results">${yourGame?cupCard(yourGame,true):""}${others.map(r=>cupCard(r,false)).join("")}</div>`;
    }else{
      const ua=mid.amisRows.find(r=>r.homeId===S.user||r.awayId===S.user);
      const extra=(showAll&&mid.cupRows.length)?`<h3 class="sect-title" style="font-size:16px;margin:22px 0 8px">${mid.label}</h3><div class="results">${mid.cupRows.map(r=>cupCard(r,false)).join("")}</div>`:"";
      midHtml=champLine+`<h3 class="sect-title" style="font-size:16px;margin:22px 0 8px">Entre semana · Amistoso</h3><div class="results">${ua?mCard(ua,26,true):'<div class="muted">—</div>'}</div>`+extra;
    }
  }
  return navHtml("results")+endBanner+devHtml+weekendHtml+midHtml;
}
function bindResults(){
  const ns=document.getElementById("newSeasonBtn");if(ns)ns.onclick=()=>nuevaTemporada();
  const nc=document.getElementById("newClubBtn");if(nc)nc.onclick=()=>{S=null;render();};
}

/* ---------- guardar / cargar partida ---------- */
const SAVE_KEY="euskalliga_save_v2"; // v2: modelo de 6 habilidades 1-20 (las partidas del modelo viejo no cargan)
function saveGame(){try{localStorage.setItem(SAVE_KEY,JSON.stringify(S));}catch(e){}}
function loadSaved(){try{const s=localStorage.getItem(SAVE_KEY);return s?JSON.parse(s):null;}catch(e){return null;}}
function restoreRuntime(){ // tras cargar: recomponer contadores de ids/nombres y limpiar estado de UI
  usados=new Set();let mx=0;
  const scan=p=>{const n=+String(p.id).slice(1);if(n>mx)mx=n;if(p.name)usados.add(p.name);};
  Object.values(S.teams).forEach(t=>t.players.forEach(scan));
  (S.cantera||[]).forEach(scan);
  PID=mx+1;
  if(S.lineup)ensureLineupRoles(S.lineup,S.teams[S.user].players); // saves antiguos: asignar capitán/lanzador por alineación
  if(S.lineupMid)ensureLineupRoles(S.lineupMid,S.teams[S.user].players);
  lineupTab="liga";tableDiv=null;pendingRelease=null;pendingReleaseY=null;releaseMsg="";
}
function exportSave(){
  if(!S)return;
  try{
    const blob=new Blob([JSON.stringify(S)],{type:"application/json"});
    const url=URL.createObjectURL(blob);const a=document.createElement("a");
    a.href=url;a.download=`euskalliga_${S.teams[S.user].abbr}_T${S.temporada}_sem${S.jornada+1}.json`;
    document.body.appendChild(a);a.click();a.remove();URL.revokeObjectURL(url);
  }catch(e){}
}
function importSave(file){
  const rd=new FileReader();
  rd.onload=()=>{try{const obj=JSON.parse(rd.result);if(obj&&obj.teams&&obj.user){S=obj;restoreRuntime();saveGame();render();}}catch(e){}};
  rd.readAsText(file);
}
function initChrome(){
  document.getElementById("themeBtn").onclick=()=>{
    const cur=document.documentElement.getAttribute("data-theme");
    const isDark=cur?cur==="dark":window.matchMedia("(prefers-color-scheme: dark)").matches;
    document.documentElement.setAttribute("data-theme",isDark?"light":"dark");
  };
  document.getElementById("saveBtn").onclick=()=>exportSave();
  document.getElementById("newBtn2").onclick=()=>{S=null;render();}; // ir al selector; al elegir club se sobrescribe el guardado
  const fi=document.getElementById("importFile");
  document.getElementById("importBtn").onclick=()=>fi.click();
  fi.onchange=e=>{const f=e.target.files&&e.target.files[0];if(f)importSave(f);fi.value="";};
}
initChrome();
const _saved=loadSaved();
if(_saved&&_saved.teams&&_saved.user){S=_saved;restoreRuntime();}
render();
</script>

<script>if('serviceWorker' in navigator){window.addEventListener('load',function(){navigator.serviceWorker.register('sw.js').catch(function(){});});}</script>
